version: "3.9"

# Test PostgreSQL for integration tests when Testcontainers is broken
# Usage: docker-compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:18
    container_name: edgerush-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: lootman_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d lootman_test"]
      interval: 5s
      timeout: 5s
      retries: 5
