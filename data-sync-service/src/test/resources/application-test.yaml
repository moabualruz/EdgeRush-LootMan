spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  main:
    allow-bean-definition-overriding: true

  # Testcontainers PostgreSQL
  datasource:
    url: jdbc:tc:postgresql:16:///test?TC_TMPFS=/testtmpfs:rw
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
    baseline-on-migrate: true

  # Mock OAuth2 Client Registrations (prevents bean initialization failures)
  security:
    oauth2:
      client:
        registration:
          battlenet:
            client-id: test-battlenet-client-id
            client-secret: test-battlenet-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/auth/battlenet/callback
            scope: openid,wow.profile
          discord:
            client-id: test-discord-client-id
            client-secret: test-discord-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/auth/discord/callback
            scope: identify,email
        provider:
          battlenet:
            authorization-uri: http://localhost:9999/oauth/authorize
            token-uri: http://localhost:9999/oauth/token
            user-info-uri: http://localhost:9999/oauth/userinfo
            user-name-attribute: sub
          discord:
            authorization-uri: http://localhost:9999/oauth/authorize
            token-uri: http://localhost:9999/oauth/token
            user-info-uri: http://localhost:9999/users/@me
            user-name-attribute: id

# Mock OAuth2 properties (custom config)
oauth2:
  discord:
    client-id: test-discord-client-id
    client-secret: test-discord-client-secret
    redirect-uri: http://localhost:8080/auth/discord/callback
    scopes: identify email
  battlenet:
    client-id: test-battlenet-client-id
    client-secret: test-battlenet-client-secret
    redirect-uri: http://localhost:8080/auth/battlenet/callback
    region: us
  jwt:
    secret: test-jwt-secret-must-be-at-least-256-bits-long-for-hs256-algorithm-security
    access-token-validity-minutes: 15
    refresh-token-validity-days: 30
    issuer: edgerush-lootman-test

# Disable external APIs (mock endpoints)
sync:
  cron: "0 0 4 * * *"
  run-on-startup: false
  wowaudit:
    base-url: http://localhost:9999/mock/wowaudit
    guild-profile-uri: http://localhost:9999/mock/wowaudit/guild
    api-key: test-api-key

# Warcraft Logs - disabled for tests
warcraft-logs:
  enabled: false
  client-id: test-wcl-client-id
  client-secret: test-wcl-client-secret
  base-url: http://localhost:9999/mock/warcraftlogs
  token-url: http://localhost:9999/mock/warcraftlogs/oauth/token

# JWT for tests
jwt:
  secret: test-jwt-secret-must-be-at-least-256-bits-long-for-hs256-algorithm-security
  expiration-ms: 86400000
  issuer: edgerush-lootman-test

# HTTP Client timeouts for tests (faster failures)
http-clients:
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
  write-timeout-ms: 5000
  max-retries: 1

# Admin mode enabled for tests
api:
  admin-mode:
    enabled: true
  rate-limit:
    enabled: false

# Simulation disabled for tests
simulation:
  enabled: false

logging:
  level:
    root: WARN
    com.edgerush: DEBUG
    org.testcontainers: INFO
